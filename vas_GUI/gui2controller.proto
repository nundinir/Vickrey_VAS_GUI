syntax = "proto3";

message Null {};

/* This service is between
Client: Sending logging data from GUI
Server: Once receiving the logging data, RPI sends a null message
*/

service CommunicationService{
  rpc GUI_Messenger (data_stream) returns (Null) {}

}

message data_stream {
    float time = 1;
    float current_torque_selected = 2;
    string adjusted_slider_btn = 3;
    float adjusted_slider_value = 4;
    string confirm_btn_pressed = 5;
}
