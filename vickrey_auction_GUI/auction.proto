syntax = "proto3";

/*
messages between client(caller) and server(auctionhouse)
*/
message Null {};

message receipt {
   bool received = 1;
}

message result {
   float win = 1;
   float amount = 2;
}

message testmsg {
   string subject = 1;
}

service auction {
   // caller sends bids to auctionhouse
   rpc call (result) returns (receipt) {};
   rpc testconnection (testmsg) returns (receipt) {};
}